# =============================================================================
# TEMPLATE — backend credentials for the `default` namespace.
#
# ⚠️  DO NOT put a filled-in copy inside k8s/backend/ (or any k8s/<app> dir).
#     ArgoCD applies EVERY *.yaml in an app's path — a real secret there would
#     be committed to Git AND overwrite the live secret. Apply from OUTSIDE any
#     synced path:
#
#       cp examples/secrets/backend-mandigo-db-credentials.example.yaml /tmp/be.yaml
#       # edit /tmp/be.yaml
#       kubectl apply -f /tmp/be.yaml
#
# NOTE: same NAME as the `database` namespace secret but DIFFERENT KEYS —
# Secrets are namespace-scoped, so these are two independent objects. The
# backend Deployment reads DATABASE_URL and JWT_SECRET from THIS one.
#
# DATABASE_URL uses the Postgres Service's cross-namespace cluster DNS name
# (mandigo-db-service.database.svc.cluster.local). The user + password must
# match the database namespace secret; special characters in the password must
# be URL-encoded (e.g. "!" -> "%21").
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mandigo-db-credentials
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mandigo_admin:CHANGE_ME_urlencoded_password@mandigo-db-service.database.svc.cluster.local:5432/mandigo_marketplace"
  # Signing key for auth JWTs. Generate with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_openssl_rand_hex_32"
