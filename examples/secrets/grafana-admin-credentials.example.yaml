# =============================================================================
# TEMPLATE — Grafana admin credentials for the `monitoring` namespace.
#
# ⚠️  DO NOT put a filled-in copy inside k8s/monitoring/ (or any k8s/<app> dir).
#     ArgoCD applies EVERY *.yaml in an app's path — a real secret there would
#     be committed to Git AND overwrite the live secret. Apply from OUTSIDE any
#     synced path:
#
#       cp examples/secrets/grafana-admin-credentials.example.yaml /tmp/gf.yaml
#       # edit /tmp/gf.yaml
#       kubectl apply -f /tmp/gf.yaml
#
# APPLY THIS BEFORE syncing the monitoring app: helmchart.yaml sets
# grafana.admin.existingSecret=grafana-admin-credentials, so Grafana won't
# start without it. Both keys are required. Grafana updates the admin password
# from this Secret on pod (re)start.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_use_a_long_random_string"
