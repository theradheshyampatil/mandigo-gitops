# =============================================================================
# TEMPLATE — Postgres credentials for the `database` namespace.
#
# ⚠️  DO NOT put a filled-in copy inside k8s/database/ (or any k8s/<app> dir).
#     ArgoCD applies EVERY *.yaml in an app's path — a real secret there would
#     be committed to Git AND overwrite the live secret. Apply real secrets
#     straight from your machine, from OUTSIDE any synced path:
#
#       cp examples/secrets/database-mandigo-db-credentials.example.yaml /tmp/db.yaml
#       # edit /tmp/db.yaml
#       kubectl apply -f /tmp/db.yaml
#
# Consumed by the Postgres StatefulSet via envFrom (postgres:15 uses these to
# initialize the DB on first boot). POSTGRES_USER must match the user in the
# backend's DATABASE_URL.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mandigo-db-credentials
  namespace: database
type: Opaque
stringData:
  POSTGRES_USER: "mandigo_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_use_a_long_random_string"
  POSTGRES_DB: "mandigo_marketplace"
