# =============================================================================
# TEMPLATE — copy to secret.yaml, fill in real values, and apply MANUALLY.
#   cp k8s/backend/secret.example.yaml k8s/backend/secret.yaml
#   # edit secret.yaml
#   kubectl apply -f k8s/backend/secret.yaml
#
# secret.yaml is gitignored — NEVER commit it. ArgoCD does not manage this
# Secret; it is a manual bootstrap step (see repo README).
#
# NOTE: this Secret has the SAME NAME as the one in the `database` namespace
# but DIFFERENT KEYS. Kubernetes Secrets are namespace-scoped, so these are
# two independent objects. The backend Deployment (namespace `default`) reads
# DATABASE_URL and JWT_SECRET from THIS one.
#
# DATABASE_URL points at the Postgres Service across namespaces using its
# fully-qualified cluster DNS name:
#   <service>.<namespace>.svc.cluster.local
#   -> mandigo-db-service.database.svc.cluster.local
# The user/password/db must match k8s/database/secret.yaml.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mandigo-db-credentials
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mandigo:CHANGE_ME_use_a_long_random_string@mandigo-db-service.database.svc.cluster.local:5432/mandigo_marketplace"
  # Signing key for auth JWTs. Generate with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_openssl_rand_hex_32"
