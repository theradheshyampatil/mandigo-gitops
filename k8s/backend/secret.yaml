# =============================================================================
# Backend API runtime secrets
# =============================================================================
#
# Holds the database connection string the Hono backend reads as
# DATABASE_URL (via env.valueFrom.secretKeyRef in deployment.yaml).
#
# Connection details mirror the existing Postgres deployment in
# k8s/database/postgres.yaml:
#
#   user:     mandigo_admin
#   password: SuperSecretPassword123!     (url-encoded as %21)
#   host:     mandigo-db-service.database.svc.cluster.local
#                ^ cross-namespace DNS:  <service>.<namespace>.svc.cluster.local
#                  service lives in the `database` namespace,
#                  backend lives in `default`
#   port:     5432
#   db:       mandigo_marketplace
#
# ⚠️  KNOWN LIMITATION (intentional, for now)
# This Secret is committed to a public GitHub repo in cleartext. That
# matches the existing posture of k8s/database/postgres.yaml. We will
# adopt Sealed Secrets or External Secrets Operator in a follow-up PR so
# the actual password never appears in git. Until then, treat this repo
# as security-sensitive and rotate the Postgres password before any
# production use.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mandigo-backend-api-secrets
  namespace: default
  labels:
    app: mandigo-backend-api
type: Opaque
stringData:
  # K8s will base64-encode this at storage time; we use stringData so the
  # human-readable value lives in git review diffs.
  DATABASE_URL: "postgresql://mandigo_admin:SuperSecretPassword123%21@mandigo-db-service.database.svc.cluster.local:5432/mandigo_marketplace"
