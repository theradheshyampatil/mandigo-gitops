apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandigo-backend-api
  namespace: default
  labels:
    app: mandigo-backend-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mandigo-backend-api
  template:
    metadata:
      labels:
        app: mandigo-backend-api
    spec:
      # No imagePullSecrets needed: ecr-sync.sh pre-pulls images into
      # K3s's containerd cache via the EC2 instance's IAM role.
      containers:
        - name: backend
          # CI (.github/workflows/backend-ci.yml) auto-bumps this to the
          # exact :<sha> after every successful build. :latest is just the
          # bootstrap value so the file is syntactically valid on day 1.
          image: 526955697030.dkr.ecr.ap-south-1.amazonaws.com/mandigo-backend-api:da63dbf89f54c181e92131db619aa9ad3e082b66
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: CORS_ORIGINS
              value: "https://projectbyradhe.xyz"
            # PR #6: DATABASE_URL injected from the Secret defined in
            # k8s/backend/secret.yaml (same namespace).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mandigo-backend-api-secrets
                  key: DATABASE_URL
          # ---- Probes (3-tier: startup -> liveness + readiness) -----------
          #
          # startupProbe gates liveness/readiness until the app finishes its
          # boot sequence (waitForDb -> migrate -> seed -> serve). Without
          # it, liveness could fail mid-boot and trigger a restart loop on
          # a healthy pod.
          #
          # Once the app responds 200 on /healthz once, startupProbe is
          # considered "done" and the regular probes take over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
            # 24 probes * 5s = 120s of boot tolerance.
            # Plenty for waitForDb (max 60s) + migrate + seed.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # PR #6: now points at /readyz (DB-aware). Liveness still on
            # /healthz so a transient DB blip doesn't trigger a restart.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"   # bumped from 96Mi: pg pool + Drizzle adds ~20-30Mi
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
