# =============================================================================
# Permanent public access to ArgoCD at https://argocd.projectbyradhe.xyz
# Replaces the manual `kubectl port-forward svc/argocd-server -n argocd 8080:443`.
#
# PREREQUISITES (one-time, see k8s/argocd/README.md):
#   1. ArgoCD server must run in INSECURE mode so Traefik can terminate TLS
#      at the edge and forward plain HTTP to argocd-server:80. Without this
#      you get TLS-in-TLS errors.
#        kubectl -n argocd patch configmap argocd-cmd-params-cm --type merge \
#          -p '{"data":{"server.insecure":"true"}}'
#        kubectl -n argocd rollout restart deploy argocd-server
#   2. DNS: GoDaddy A record  argocd -> 3.6.157.180
#
# Anonymous read-only access (no login) is enabled separately via
# argocd-cm / argocd-rbac-cm (see README).
# =============================================================================

# -------- HTTPS (443) --------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-secure
  namespace: argocd
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: le
    domains:
      - main: argocd.projectbyradhe.xyz
  routes:
    - match: Host(`argocd.projectbyradhe.xyz`)
      kind: Rule
      services:
        # argocd-server in insecure mode serves HTTP on port 80.
        - name: argocd-server
          port: 80

---
# -------- HTTP (80) -> HTTPS redirect --------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-redirect
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.projectbyradhe.xyz`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: argocd-server
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: argocd
spec:
  redirectScheme:
    scheme: https
    permanent: true
