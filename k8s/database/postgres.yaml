---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mandigo-db-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandigo-db
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mandigo-db
  template:
    metadata:
      labels:
        app: mandigo-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: mandigo_admin
        - name: POSTGRES_PASSWORD
          value: SuperSecretPassword123!
        - name: POSTGRES_DB
          value: mandigo_marketplace
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: mandigo-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mandigo-db-service
  namespace: database
spec:
  selector:
    app: mandigo-db
  ports:
    - port: 5432
      targetPort: 5432
