# =============================================================================
# TEMPLATE — copy to secret.yaml, fill in real values, and apply MANUALLY.
#   cp k8s/database/secret.example.yaml k8s/database/secret.yaml
#   # edit secret.yaml
#   kubectl apply -f k8s/database/secret.yaml
#
# secret.yaml is gitignored — it must NEVER be committed. ArgoCD does not
# manage this Secret; it is a manual bootstrap step (see repo README).
#
# This Secret is consumed by the Postgres StatefulSet via `envFrom`, which is
# how the official postgres:15 image initializes the DB on first boot.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mandigo-db-credentials
  namespace: database
type: Opaque
stringData:
  POSTGRES_USER: "mandigo"
  POSTGRES_PASSWORD: "CHANGE_ME_use_a_long_random_string"
  POSTGRES_DB: "mandigo_marketplace"
