apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mandigo-frontend-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/certificatesresolvers: "le"
spec:
  tls:
  - hosts:
      - projectbyradhe.xyz
    secretName: mandigo-tls-secret
  rules:
  - host: projectbyradhe.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mandigo-frontend-service
            port:
              number: 80
