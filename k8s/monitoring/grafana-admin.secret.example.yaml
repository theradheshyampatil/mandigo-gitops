# =============================================================================
# TEMPLATE — copy to grafana-admin.secret.yaml, fill in, apply MANUALLY.
#   cp k8s/monitoring/grafana-admin.secret.example.yaml \
#      k8s/monitoring/grafana-admin.secret.yaml
#   # edit grafana-admin.secret.yaml
#   kubectl apply -f k8s/monitoring/grafana-admin.secret.yaml
#
# *.secret.yaml is gitignored — NEVER commit the filled-in file.
#
# APPLY THIS BEFORE syncing the monitoring app: helmchart.yaml references
# grafana.admin.existingSecret=grafana-admin-credentials, so Grafana will not
# start until this Secret exists. Both keys are required.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_use_a_long_random_string"
