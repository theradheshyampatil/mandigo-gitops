name: 'Terraform Apply - AWS ECR'

on:
  push:
    paths:
      - 'terraform/ecr/**'   # Only the ECR module is CI-managed (wake/bootstrap are manual)
    branches:
      - main

# Least-privilege token: id-token lets us do keyless OIDC auth to AWS;
# contents:read is all checkout needs. No other scopes are granted.
permissions:
  id-token: write
  contents: read

# Never let two applies race on the same remote state.
concurrency:
  group: terraform-ecr
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_STATE_KEY: ecr/terraform.tfstate
  TF_LOCK_TABLE: mandigo-tf-lock

jobs:
  terraform:
    name: 'Terraform (ECR)'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/ecr

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Keyless auth via GitHub OIDC — no long-lived AWS keys in secrets.
      # AWS_ROLE_ARN and AWS_STATE_BUCKET come from terraform/bootstrap outputs
      # (see terraform/bootstrap/README.md). Store them as repo secrets/vars.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Apply only the reviewed plan. Runs on push to main (post-merge),
      # so the plan has already been visible in the PR's checks.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
